name: clipforge

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_MEDIA_API_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:4000}
        NEXT_PUBLIC_MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-1073741824}
        NEXT_PUBLIC_TRUEFORGE_BASE_URL: /trueforge
    environment:
      HOSTNAME: 0.0.0.0
      MEDIA_API_BASE_URL: http://media:4000
      PORT: 3000
      TRUEFORGE_BASE_URL: http://trueforge:8790
    ports:
      - "3000:3000"
    depends_on:
      media:
        condition: service_healthy
      trueforge:
        condition: service_healthy
    restart: unless-stopped

  media:
    build:
      context: .
      dockerfile: Dockerfile.media
    environment:
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      HOST: 0.0.0.0
      MEDIA_ALLOWED_ORIGINS: ${WEB_PUBLIC_ORIGIN:-http://localhost:3000}
      MEDIA_DATA_DIR: /data
      MEDIA_INTERNAL_BASE_URL: http://127.0.0.1:4000
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-1073741824}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:4000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - media_data:/data
    restart: unless-stopped

  trueforge:
    build:
      context: ./infra/trueforge
      dockerfile: Dockerfile.dev
    environment:
      APP_DATA_DIR_SUFFIX: production
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 8790
      POSTGRES_DB: ${POSTGRES_DB:-trueforge}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-trueforge}
      REDIS_URL: redis://redis:6379
      STANDALONE: "false"
    ports:
      - "8791:8790"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 35s
    restart: unless-stopped

  clipforge-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    environment:
      CLIPFORGE_MCP_URL: http://media:4000/mcp
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      TRUEFORGE_BOOTSTRAP_BASE_URL: http://trueforge:8790
    depends_on:
      media:
        condition: service_healthy
      trueforge:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trueforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-trueforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  media_data:
  postgres_data:
